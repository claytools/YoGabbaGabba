<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#101326" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Gabba After Dark</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="game"></div>
  <div id="crt" aria-hidden="true"></div>
  <div id="bug-ride" aria-hidden="true"><span class="bug-shell"></span><span class="bug-horn left"></span><span class="bug-horn right"></span></div>

  <div id="hud" class="hidden">
    <div id="topbar">
      <div class="panel stat"><span class="label">GOAL</span><span id="objective">FIND EVERYONE</span></div>
      <div class="panel stat"><span class="label">FOUND</span><span id="count">0 / 10</span></div>
      <div class="panel stat mini"><span class="label">TIME</span><span id="timer">0:00</span></div>
      <div class="panel stat mini"><span class="label">DANGER</span><span id="threat">QUIET</span></div>
      <div class="panel health-panel">
        <div class="meter-row"><span class="label">HEALTH</span><div class="meter-track"><div id="health-fill"></div></div></div>
        <div class="meter-row"><span class="label">STAMINA</span><div class="meter-track"><div id="stamina-fill"></div></div></div>
      </div>
    </div>

    <div id="minimap-wrap" class="panel">
      <canvas id="minimap" width="160" height="160" aria-label="mini map"></canvas>
    </div>

    <div id="message" aria-live="polite"></div>

    <div id="mobile-controls">
      <div id="joystick" class="touch-zone stick" aria-label="movement joystick"><div id="joystick-knob" class="stick-knob"></div></div>
      <button id="sprint" class="round-button action-button" type="button">RUN</button>
      <div id="lookstick" class="touch-zone stick" aria-label="camera joystick"><div id="lookstick-knob" class="stick-knob"></div></div>
      <div id="power-buttons"></div>
    </div>

    <div id="crosshair">+</div>
    <div id="desktop-help">WASD move · mouse drag look · Shift run · 1–5 songs</div>
  </div>

  <div id="start-screen" class="screen active">
    <div class="card">
      <h1>GABBA<br/>AFTER DARK</h1>
      <p><strong>DJ LANCE IS TRAPPED!</strong></p>
      <p>Find the 5 Gabba characters and their songs to save him!</p>
      <button id="start-button" class="primary" type="button">PLAY</button>
    </div>
  </div>

  <div id="end-screen" class="screen">
    <div class="card">
      <p class="eyebrow" id="end-eyebrow">SIGNAL LOST</p>
      <h2 id="end-title">TRY AGAIN!</h2>
      <p id="end-copy"></p>
      <button id="restart-button" class="primary" type="button">PLAY AGAIN</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
