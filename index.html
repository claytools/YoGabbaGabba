<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0d1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Gabba After Dark</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app-shell">
    <section id="screen-frame">
      <div id="game"></div>
      <div id="crt" aria-hidden="true"></div>
      <div id="bug-ride" aria-hidden="true"><span class="bug-shell"></span><span class="bug-horn left"></span><span class="bug-horn right"></span></div>

      <div id="hud" class="hidden">
        <div id="topbar">
          <div class="panel found-panel"><span class="label">FOUND</span><span id="count">0 / 10</span></div>
          <div class="panel heart-panel"><span class="label">HEALTH</span><div id="hearts" aria-label="health">♥ ♥ ♥</div></div>
        </div>

        <div id="minimap-wrap" class="panel">
          <canvas id="minimap" width="220" height="220" aria-label="local mini map"></canvas>
          <div id="compass-n">N</div>
        </div>

        <div id="message" aria-live="polite"></div>
        <div id="crosshair">+</div>
      </div>
    </section>

    <section id="control-deck">
      <div id="power-buttons"></div>

      <div id="gamepad-row">
        <div class="stick-block">
          <span class="control-label">MOVE</span>
          <div id="joystick" class="touch-zone stick" aria-label="movement joystick"><div id="joystick-knob" class="stick-knob"></div></div>
        </div>

        <div id="center-controls">
          <div id="run-cluster">
            <div id="stamina-rail"><div id="stamina-fill"></div></div>
            <button id="sprint" class="round-button action-button" type="button">RUN</button>
          </div>
          <button id="fullscreen-toggle" class="utility-button" type="button">FULL</button>
          <button id="music-toggle" class="utility-button" type="button">MUSIC</button>
        </div>

        <div class="stick-block">
          <span class="control-label">LOOK</span>
          <div id="lookstick" class="touch-zone stick" aria-label="camera joystick"><div id="lookstick-knob" class="stick-knob"></div></div>
        </div>
      </div>

      <div id="desktop-help">WASD move · mouse drag look · Shift run · 1–5 songs</div>
    </section>
  </main>

  <div id="start-screen" class="screen active">
    <div class="card game-card">
      <div class="start-tv">
        <div class="start-screen-glow">
          <div class="lance-mini"><span></span></div>
        </div>
      </div>
      <p class="eyebrow">TONIGHT IN GABBA LAND</p>
      <h1>GABBA<br/>AFTER DARK</h1>
      <p><strong>DJ LANCE IS TRAPPED.</strong></p>
      <p>Find 5 friends. Find 5 songs. Get back to the TV.</p>
      <button id="start-button" class="primary" type="button">START</button>
    </div>
  </div>

  <div id="end-screen" class="screen">
    <div class="card">
      <p class="eyebrow" id="end-eyebrow">SIGNAL LOST</p>
      <h2 id="end-title">TRY AGAIN!</h2>
      <p id="end-copy"></p>
      <button id="restart-button" class="primary" type="button">PLAY AGAIN</button>
    </div>
  </div>

  <audio id="bgm" loop preload="none" src="https://opengameart.org/sites/default/files/curious_theme.ogg"></audio>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
